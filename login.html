<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | Verdant Business Services</title>
  <meta name="description" content="Secure client login for Verdant Business Services. Access your company incorporation tracker, compliance calendar, and document vault.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="alternate icon" type="image/png" href="assets/images/website-logo.png">
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Top-Right Controls (Above Card on Mobile) -->
    <div class="auth-header-controls">
      <button class="toggle-btn theme-toggle-btn" aria-label="Toggle light and dark theme"></button>
      <button class="toggle-btn rtl-toggle-btn" aria-label="Toggle RTL mode" title="Right to Left / Left to Right">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M16 3l4 4-4 4"/>
          <path d="M20 17H4M8 21l-4-4 4-4"/>
        </svg>
      </button>
    </div>

    <div class="auth-card">
      <div class="auth-brand">
        <a href="index.html" class="brand-logo" style="margin-bottom: 1.25rem;">
          <div class="brand-icon-box">
          <img src="assets/images/logo.svg" alt="Verdant Logo" class="brand-logo-img">
        </div>
          <div class="brand-title-wrap">
            <span class="brand-title">VERDANT</span>
            <span class="brand-subtitle">Business Services</span>
          </div>
        </a>
        <h2 style="font-size: 1.65rem; margin-bottom: 0.35rem;">Welcome Back</h2>
        <p style="font-size: 0.95rem; margin-bottom: 0;">Sign in to manage your company registration, filings, and compliance calendar.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Business Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row-remember">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="rememberMe">
            <span>Remember Me</span>
          </label>
          <a href="forgot-password.html" style="color: var(--color-primary); font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 0;">SIGN IN TO PORTAL</button>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <div class="social-auth-stack">
          <button type="button" class="btn btn-social btn-google" onclick="if(window.VerdantAuth){localStorage.setItem('verdant_user_session', JSON.stringify({name:'Google Client', email:'client@gmail.com', business:'Google Verified Startup', businessType:'Private Limited', joined: new Date().toISOString().split('T')[0]})); window.location.href='dashboard.html';}">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <button type="button" class="btn btn-social btn-apple" onclick="if(window.VerdantAuth){localStorage.setItem('verdant_user_session', JSON.stringify({name:'Apple Client', email:'client@icloud.com', business:'Apple Verified Enterprise', businessType:'Private Limited', joined: new Date().toISOString().split('T')[0]})); window.location.href='dashboard.html';}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.9.04-2 .6-2.65 1.36-.57.66-.98 1.74-.85 2.78 1.01.08 1.97-.52 2.58-1.27z"/>
            </svg>
            <span>Continue with Apple</span>
          </button>
        </div>

        <div style="text-align: center; font-size: 0.92rem; color: var(--text-muted);">
          Don't have a client account? <a href="register.html" style="color: var(--color-primary); font-weight: 600;">Register Here</a>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
