<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Verdant Business Services</title>
  <meta name="description" content="Reset your client portal password for Verdant Business Services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="alternate icon" type="image/png" href="assets/images/website-logo.png">
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Top-Right Controls (Above Card on Mobile) -->
    <div class="auth-header-controls">
      <button class="toggle-btn theme-toggle-btn" aria-label="Toggle light and dark theme"></button>
      <button class="toggle-btn rtl-toggle-btn" aria-label="Toggle RTL mode" title="Right to Left / Left to Right">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M16 3l4 4-4 4"/>
          <path d="M20 17H4M8 21l-4-4 4-4"/>
        </svg>
      </button>
    </div>

    <div class="auth-card">
      <div class="auth-brand">
        <a href="index.html" class="brand-logo" style="margin-bottom: 1.25rem;">
          <div class="brand-icon-box">
            <img src="assets/images/logo.svg" alt="Verdant Logo" class="brand-logo-img">
          </div>
          <div class="brand-title-wrap">
            <span class="brand-title">VERDANT</span>
            <span class="brand-subtitle">Business Services</span>
          </div>
        </a>
        <h2 style="font-size: 1.65rem; margin-bottom: 0.35rem;">Reset Password</h2>
        <p style="font-size: 0.95rem; margin-bottom: 0;">Enter your registered business email and we'll dispatch simulated recovery instructions.</p>
      </div>

      <div id="forgotSuccessMsg" style="display: none; background-color: rgba(16, 185, 129, 0.12); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 1.5rem; font-size: 0.92rem;"></div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email" class="form-label">Registered Business Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1.25rem;">SEND RESET INSTRUCTIONS</button>

        <div style="text-align: center; font-size: 0.92rem; color: var(--text-muted);">
          Remembered your password? <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Return to Login</a>
        </div>
      </form>

      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); text-align: center;">
        <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Return to Public Website</a>
      </div>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
