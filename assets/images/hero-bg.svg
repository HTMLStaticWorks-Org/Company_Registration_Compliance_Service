<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Background Gradient (Light, clean corporate ice surface) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F6FF" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EBF3FD" stop-opacity="1"/>
    </linearGradient>

    <!-- Ambient Glow Gradient Behind 3D Tablet Mockup -->
    <radialGradient id="glowMockup" cx="75%" cy="45%" r="48%" fx="75%" fy="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Left Corporate Glow -->
    <radialGradient id="glowLeft" cx="15%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.09"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Left Glow -->
    <radialGradient id="glowBottom" cx="30%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Coordinate Grid Pattern -->
    <pattern id="techGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1D4ED8" stroke-width="0.75" stroke-opacity="0.055"/>
      <circle cx="0" cy="0" r="1.5" fill="#1D4ED8" fill-opacity="0.14"/>
    </pattern>

    <!-- Isometric Decorative Gradient Lines -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Smooth Background Fill -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- High-Tech Coordinate Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#techGrid)"/>

  <!-- Soft Ambient Colorful Glow Orbs -->
  <rect width="1920" height="1080" fill="url(#glowMockup)"/>
  <rect width="1920" height="1080" fill="url(#glowLeft)"/>
  <rect width="1920" height="1080" fill="url(#glowBottom)"/>

  <!-- Atmospheric Fluid Waves -->
  <path d="M-100,720 C280,640 580,910 980,760 C1380,610 1620,830 2040,680 L2040,1180 L-100,1180 Z" fill="#1D4ED8" fill-opacity="0.035"/>
  <path d="M-50,790 C420,690 740,950 1180,800 C1620,650 1810,870 2060,740 L2060,1180 L-50,1180 Z" fill="#6366F1" fill-opacity="0.025"/>

  <!-- Modern Graphic Curve Vectors -->
  <path d="M 750,180 Q 1150,360 1780,260" stroke="url(#lineGrad1)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 820,220 Q 1200,400 1830,300" stroke="url(#lineGrad1)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 400,680 Q 850,520 1450,740" stroke="url(#lineGrad2)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Concentric Target Circles (Upper Right & Bottom Left) -->
  <circle cx="1550" cy="190" r="180" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.14" stroke-dasharray="8 6"/>
  <circle cx="1550" cy="190" r="120" stroke="#6366F1" stroke-width="1" stroke-opacity="0.16"/>
  <circle cx="1550" cy="190" r="6" fill="#3B82F6" fill-opacity="0.4"/>

  <circle cx="280" cy="850" r="140" stroke="#1D4ED8" stroke-width="1" stroke-opacity="0.10" stroke-dasharray="6 6"/>
  <circle cx="280" cy="850" r="80" stroke="#0284C7" stroke-width="1" stroke-opacity="0.12"/>
  <circle cx="280" cy="850" r="4" fill="#0284C7" fill-opacity="0.35"/>

  <!-- Delicate Floating Tech Polygonal Wireframes -->
  <polygon points="120,460 300,380 400,520 220,600" stroke="#1D4ED8" stroke-width="1" stroke-opacity="0.07" fill="none"/>
  <circle cx="300" cy="380" r="3" fill="#1D4ED8" fill-opacity="0.22"/>
  <circle cx="220" cy="600" r="3" fill="#1D4ED8" fill-opacity="0.22"/>

  <polygon points="1680,680 1820,620 1900,730 1760,790" stroke="#6366F1" stroke-width="1" stroke-opacity="0.08" fill="none"/>
  <circle cx="1820" cy="620" r="2.5" fill="#6366F1" fill-opacity="0.25"/>
</svg>
